name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:safari
      - run: npm run zip
      - name: Validate extension package
        run: |
          test -f .output/chrome-mv3/manifest.json
          test -f .output/safari-mv2/manifest.json
          test -n "$(find .output -maxdepth 1 -name '*-chrome.zip' -print -quit)"
